project:
  type: book
  output-dir: docs
  resources:
    - thesis-template.zip
  
book:
  title: Statistics Seminar
  author: Prof. Dr. Dominik Liebl 
  date: last-modified
  date-format: "[Last Updated on] MMMM DD, YYYY"
  sidebar: 
    logo: images/KU_Logo_Blau_M.png
    number-depth: 2
  search: true
  chapters:
    - index.qmd
    - 01-Monte-Carlo.qmd
    - 02-Topics.qmd
    - 03-Seminar-Thesis.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: [flatly, theme-light.scss, theme.scss]
      dark: [flatly, darkly, theme-dark.scss, theme.scss]
    html-math-method:
      method: mathjax
      url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/latest.js?config=TeX-MML-AM_CHTML"
    number-sections: true
    code-link: true
    reference-links: true
    reference-location: margin
    knitr:
      opts_chunk:
        fig.align: center
        fig-align: center
